<label id="output">

</label>

"a, non, Aeolian", "a, sharp, Aeolian" und "b, none, Aeolian" gehen momentan nicht
</label>-->



<script defer>
    vorzeichenAndModeToAll.onclick = function() {
        
        


    }
    
    vorzeichenAndHalftoneToAll.onclick = function() {
        
        


    }
    
    
    wtcNrToAll.onclick = function() {
        mode.value = ""+(5*(+( wtcNr.value % 2 == 0)))
        let halbton = ((+wtcNr.value + (+wtcNr.value % 2))/2) - 1;
        let ganzton = Math.ceil(halbton / 2);
        let halbtonEF = halbton + (+(halbton > 4))
        if(wtcNr.value == 3 || wtcNr.value == 4 || wtcNr.value == 8)
        {
             ganzton -= 1;
        } else 
        {
             if(wtcNr.value == 17 || wtcNr.value == 21 || wtcNr.value == 22)
             {
                  ganzton += 1;
             }  
        }
        console.log("ganzton nach " + ganzton )
        halftone.value = (halbtonEF - 2 * ganzton )
        natural.value = ganzton 
    }
    halftoneAndModeToAll.onclick  = function() {
        
        let wurst = natural.value /*2*((natural.value - 1)%7)2*(([byte][char]$ton - 1)%7)*/
        wurst *= 2
        wurst -= (+(wurst > 4))
        wurst +=  halftone.value - (2 * mode.value )
        wurst += (+(mode.value > 2))
        wurst += 12*(+(wurst < 0))
        output2.textContent=""
        if(mode.value === "0"){
            wtcNr.value = (2*wurst + 1)%24
        }
        
        if(mode.value === "5"){
              wtcNr.value = ((((2*(wurst-3) + 1)+24)%24)+1)
        }
        wurst = (wurst + 6 * (+(wurst % 2 !== 0))) % 12

        if(wurst < 8){
            vorzeichenArt.value = "0"
            vorzeichen.value = wurst
        }
        else
        {
            vorzeichenArt.value = "1" 
            vorzeichen.value = (12 - wurst)
        }
     
    };
</script>
